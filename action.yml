name: Shablon Template Sync
description: Create or update MJML email templates in Shablon from files in your repository.
author: Michael Schramm
branding:
  icon: mail
  color: blue

inputs:
  apiKey:
    description: Shablon API key (e.g. `sk.****`). Store it as a secret.
    required: true
  basePath:
    description: Folder (relative to the repository root) that contains the `<slug>.mjml` / `<slug>.yaml` files. Searched recursively.
    required: true
  apiUrl:
    description: Base URL of the Shablon API.
    required: false
    default: https://api.shablon.eu
  dryRun:
    description: Validate templates and show what would change without creating or updating anything.
    required: false
    default: 'false'

outputs:
  created:
    description: JSON array of slugs that were created.
  updated:
    description: JSON array of slugs that were updated.
  unchanged:
    description: JSON array of slugs that were already up to date.

runs:
  using: node24
  main: dist/index.js
